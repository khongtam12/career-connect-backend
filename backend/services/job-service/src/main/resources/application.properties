spring.application.name=job-service

spring.datasource.url=jdbc:postgresql://localhost:5434/job-service
spring.datasource.username=postgres
spring.datasource.password=123

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

server.port=8082
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Fix: force dùng 127.0.0.1 thay vì WSL2 network adapter (172.x.x.x)
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

spring.cache.type=redis
spring.cache.redis.time-to-live=300000
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=job-service::
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=${OPENAI_BASE_URL}
spring.ai.openai.chat.options.model=${AI_MODEL}
spring.ai.openai.chat.options.max-tokens=1000


spring.application.name=cv-service
server.port=8087

spring.datasource.url=jdbc:postgresql://localhost:5432/cv
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

cloud.aws.credentials.access-key=${AWS_ACCESS_KEY:dummy}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY:dummy}
cloud.aws.s3.bucket=${S3_BUCKET_NAME:dummy-bucket}
cloud.aws.region.static=ap-southeast-1
cloud.aws.stack.auto=false

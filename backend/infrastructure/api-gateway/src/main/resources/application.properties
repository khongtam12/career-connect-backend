
spring.application.name=api-gateway
server.port=8080

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway=INFO

# --- ROUTES CONFIGURATION ---

# 0. Job Service
spring.cloud.gateway.routes[0].id=job-service
spring.cloud.gateway.routes[0].uri=lb://job-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/job/**
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.name=jobCircuitBreaker
spring.cloud.gateway.routes[0].filters[0].args.fallbackUri=forward:/fallback/service
spring.cloud.gateway.routes[0].filters[0].args.statusCodes[0]=500
spring.cloud.gateway.routes[0].filters[0].args.statusCodes[1]=502
spring.cloud.gateway.routes[0].filters[0].args.statusCodes[2]=503
spring.cloud.gateway.routes[0].filters[0].args.statusCodes[3]=504

# 1. User Service
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/user/**,/api/v1/admin/**
spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=userCircuitBreaker

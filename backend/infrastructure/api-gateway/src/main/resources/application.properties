rate-limiter.version=v3
REDIS_HOST=localhost

spring.codec.max-in-memory-size=10MB

# Default filters (Remove CircuitBreaker from here)
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

# Resilience4j Properties for Gateway
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=50s
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.timelimiter.configs.default.timeoutDuration=30s
resilience4j.timelimiter.configs.default.cancelRunningFuture=true

resilience4j.circuitbreaker.instances.jobCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.userCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.applyCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.companyCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.notificationCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.paymentCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.cvCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.storageCircuitBreaker.baseConfig=default

resilience4j.timelimiter.instances.jobCircuitBreaker.baseConfig=default
resilience4j.timelimiter.instances.userCircuitBreaker.baseConfig=default
resilience4j.timelimiter.instances.applyCircuitBreaker.baseConfig=default
resilience4j.timelimiter.instances.companyCircuitBreaker.baseConfig=default
resilience4j.timelimiter.instances.notificationCircuitBreaker.baseConfig=default
resilience4j.timelimiter.instances.paymentCircuitBreaker.baseConfig=default
resilience4j.timelimiter.instances.cvCircuitBreaker.baseConfig=default
resilience4j.timelimiter.instances.storageCircuitBreaker.baseConfig=default

# Gateway Timeout Configuration (Global)
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=10s

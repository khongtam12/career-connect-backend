
spring.application.name=api-gateway
server.port=8080

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
logging.level.org.springframework.cloud.gateway=TRACE



spring.cloud.gateway.routes[0].id=job-service
spring.cloud.gateway.routes[0].uri=lb://job-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/job/**



spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/user/**,/api/v1/admin/**


spring.cloud.gateway.routes[2].id=application-service
spring.cloud.gateway.routes[2].uri=lb://application-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/apply/**


spring.cloud.gateway.routes[3].id=company-service
spring.cloud.gateway.routes[3].uri=lb://company-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/company/**


spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=lb://notification-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/notifications/**


spring.cloud.gateway.routes[5].id=payment-service
spring.cloud.gateway.routes[5].uri=lb://payment-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/package/**

spring.cloud.gateway.routes[6].id=cv-service
spring.cloud.gateway.routes[6].uri=lb://cv-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/cvs/**





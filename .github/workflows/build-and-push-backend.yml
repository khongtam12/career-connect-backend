name: Build And Push Backend Images

on:
  push:
    branches:
      - deloy-test
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: career-connect-backend
  IMAGE_TAG: deloy-test

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: eureka-server
            dockerfile: infrastructure/eureka-server/Dockerfile
          - service: api-gateway
            dockerfile: infrastructure/api-gateway/Dockerfile
          - service: user-service
            dockerfile: services/user-service/Dockerfile
          - service: company-service
            dockerfile: services/company-service/Dockerfile
          - service: job-service
            dockerfile: services/job-service/Dockerfile
          - service: application-service
            dockerfile: services/application-service/Dockerfile
          - service: payment-service
            dockerfile: services/payment-service/Dockerfile
          - service: notification-service
            dockerfile: services/notification-service/Dockerfile
          - service: cv-service
            dockerfile: services/cv-service/Dockerfile
          - service: storage-service
            dockerfile: services/storage-service/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
